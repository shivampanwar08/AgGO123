      <circle cx="745" cy="320" r="18" fill="#fef9c3" stroke="#92400e" stroke-width="4"/>

      <rect x="395" y="170" width="200" height="22" rx="6" fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6"/>
      <path d="M 410 290 L 410 195 L 580 195 L 580 290 Z" fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6" stroke-linejoin="round"/>
      <rect x="430" y="210" width="135" height="65" rx="4" fill="url(#glassGrad)" stroke="#92400e" stroke-width="4"/>
