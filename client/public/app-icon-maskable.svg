    <g filter="url(#textShadow)">
      <text x="402" y="800" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="190" font-weight="900" fill="#ffffff" letter-spacing="-8">Ag</text>
      <text x="618" y="800" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="190" font-weight="900" fill="url(#goGrad)" letter-spacing="-8">Go</text>
    </g>
    <text x="512" y="890" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="48" font-weight="800" fill="#fde68a" letter-spacing="14" fill-opacity="0.95">RENT · SELL · BUY</text>
