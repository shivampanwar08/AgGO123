<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#shade)"/>

  <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
    <g filter="url(#leafShadow)">
      <path d="M 512 360 Q 510 320, 514 285" fill="none" stroke="#86efac" stroke-width="10" stroke-linecap="round"/>
      <path d="M 510 320 Q 460 305, 442 268 Q 478 268, 510 305 Z" fill="url(#leafGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 514 320 Q 564 305, 582 268 Q 546 268, 514 305 Z" fill="url(#leafGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="514" cy="270" r="14" fill="#fde68a"/>
    </g>

    <g filter="url(#textShadow)">
      <text x="512" y="640" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
        font-size="280" font-weight="900" fill="#ffffff" letter-spacing="-10">AgG</text>

      <g transform="translate(770 555)">
        <path d="M 0 0 C -55 0, -90 35, -90 90 C -90 145, -55 180, 0 180 C 55 180, 90 145, 90 90 C 90 35, 55 0, 0 0 Z"
          fill="url(#leafGrad)" stroke="#ffffff" stroke-width="14"/>
        <path d="M -50 50 Q 0 90, 50 130" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85"/>
        <path d="M 50 5 Q 80 -15, 105 -25 Q 95 5, 75 18 Z" fill="url(#leafGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>

    <text x="512" y="800" text-anchor="middle"
      font-family="'Plus Jakarta Sans', Arial, sans-serif"
      font-size="46" font-weight="800" fill="#dcfce7"
      letter-spacing="14" fill-opacity="0.95">FARM · SHOP · SELL</text>
    <rect x="362" y="830" width="300" height="5" rx="2.5" fill="#fbbf24" fill-opacity="0.85"/>
  </g>
</svg>
