<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="botShade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#052e16" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full bleed (mask handles corners) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#topGlow)"/>
  <rect width="1024" height="1024" fill="url(#botShade)"/>

  <!-- Mark scaled to safe inner 75% so Android adaptive masks don't crop it -->
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)" filter="url(#markShadow)">
    <path d="M 512 250 C 460 320, 380 480, 320 720 C 320 770, 380 800, 430 770 C 470 660, 500 520, 512 420 Z" fill="url(#markGrad)"/>
    <path d="M 512 250 C 564 320, 644 480, 704 720 C 704 770, 644 800, 594 770 C 554 660, 524 520, 512 420 Z" fill="url(#markGrad)"/>
    <path d="M 415 580 Q 512 555, 609 580 L 600 625 Q 512 605, 424 625 Z" fill="url(#markGrad)"/>
    <circle cx="512" cy="220" r="26" fill="url(#markGrad)"/>
    <path d="M 512 200 Q 540 175, 555 145 Q 530 160, 512 195 Z" fill="url(#markGrad)"/>
    <path d="M 470 380 Q 430 540, 380 720" fill="none" stroke="#16a34a" stroke-width="6" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M 554 380 Q 594 540, 644 720" fill="none" stroke="#16a34a" stroke-width="6" stroke-opacity="0.18" stroke-linecap="round"/>
    <circle cx="572" cy="172" r="10" fill="#fbbf24"/>
    <circle cx="572" cy="172" r="4" fill="#ffffff"/>
  </g>
</svg>
