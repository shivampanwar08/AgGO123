      <line x1="200" y1="668" x2="824" y2="668" stroke-opacity="0.7"/>
    </g>

    <g filter="url(#dropShadow)">
      <rect x="354" y="190" width="28" height="100" rx="6" fill="#374151" stroke="#0f172a" stroke-width="4"/>
