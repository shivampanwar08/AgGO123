<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BACKGROUND -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- GEAR — premium gold gradient -->
    <linearGradient id="gearOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gearInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="gearShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- WHEAT GREEN -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="grainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- "Go" lime gradient -->
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BASE -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#sheen)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#shade)"/>
  <rect x="14" y="14" width="996" height="996" rx="218" ry="218"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Halo behind gear -->
  <circle cx="512" cy="395" r="270" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="512" cy="395" r="220" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Decorative sparkles -->
  <circle cx="200" cy="220" r="6" fill="#fde047" fill-opacity="0.7"/>
  <circle cx="824" cy="240" r="8" fill="#bef264" fill-opacity="0.7"/>
  <circle cx="180" cy="500" r="5" fill="#fde047" fill-opacity="0.6"/>
  <circle cx="850" cy="520" r="6" fill="#bef264" fill-opacity="0.6"/>
  <circle cx="240" cy="160" r="14" fill="url(#sparkle)"/>
  <circle cx="800" cy="170" r="14" fill="url(#sparkle)"/>

  <!-- ══════════════════════════════════════════════════
       HERO MARK — Premium GEAR with WHEAT growing inside
       (universal symbol for "agricultural equipment")
       ══════════════════════════════════════════════════ -->
  <g filter="url(#dropShadow)" transform="translate(512 395)">

    <!-- ═══ OUTER GEAR — 12 bold teeth ═══ -->
    <g>
      <!-- Build gear shape: outer circle r=210 with 12 trapezoidal teeth -->
      <path d="
        M 0 -210
        L 32 -210 L 38 -178 L 38 -178
        A 178 178 0 0 1 89 -154
        L 117 -171 L 138 -149 L 154 -89
        A 178 178 0 0 1 178 -38
        L 210 -32 L 210 32 L 178 38
        A 178 178 0 0 1 154 89
        L 171 117 L 149 138 L 89 154
        A 178 178 0 0 1 38 178
        L 32 210 L -32 210 L -38 178
        A 178 178 0 0 1 -89 154
        L -117 171 L -138 149 L -154 89
        A 178 178 0 0 1 -178 38
        L -210 32 L -210 -32 L -178 -38
        A 178 178 0 0 1 -154 -89
        L -171 -117 L -149 -138 L -89 -154
        A 178 178 0 0 1 -38 -178
        L -32 -210 Z
      "
      fill="url(#gearOuter)"
      stroke="#854d0e"
      stroke-width="6"
      stroke-linejoin="round"/>

      <!-- Highlight on top half of gear -->
      <ellipse cx="-30" cy="-90" rx="120" ry="60" fill="url(#gearShine)"/>

      <!-- Inner ring (decorative) -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#854d0e" stroke-width="4" stroke-opacity="0.4"/>

      <!-- Bolt holes between teeth (decorative dots) -->
      <g fill="#854d0e" fill-opacity="0.6">
        <circle cx="0" cy="-150" r="5"/>
        <circle cx="106" cy="-106" r="5"/>
        <circle cx="150" cy="0" r="5"/>
        <circle cx="106" cy="106" r="5"/>
        <circle cx="0" cy="150" r="5"/>
        <circle cx="-106" cy="106" r="5"/>
        <circle cx="-150" cy="0" r="5"/>
        <circle cx="-106" cy="-106" r="5"/>
      </g>

      <!-- ═══ CENTER DISC (where the wheat sits) ═══ -->
      <circle cx="0" cy="0" r="125" fill="#14532d" stroke="#854d0e" stroke-width="6"/>
      <circle cx="0" cy="0" r="125" fill="url(#bgGrad)" fill-opacity="0.8"/>
    </g>

    <!-- ═══ PROFESSIONAL FARMER PORTRAIT (waist-up) holding wheat sheaf ═══ -->
    <g stroke="#1c1917" stroke-linejoin="round" stroke-linecap="round">

      <!-- ═══ SHOULDERS / SHIRT base ═══ -->
      <path d="
        M -68 95
        Q -60 50, -38 30
        L 38 30
        Q 60 50, 68 95
        Z"
        fill="#15803d" stroke-width="4"/>

      <!-- Shirt buttons placket -->
      <line x1="0" y1="35" x2="0" y2="92" stroke="#14532d" stroke-width="2.5"/>
      <circle cx="0" cy="50" r="2.5" fill="#fde047" stroke-width="0"/>
      <circle cx="0" cy="65" r="2.5" fill="#fde047" stroke-width="0"/>
      <circle cx="0" cy="80" r="2.5" fill="#fde047" stroke-width="0"/>

      <!-- Shirt collar -->
      <path d="M -22 30 L -12 22 L 0 30 L 12 22 L 22 30 Z"
        fill="#86efac" stroke-width="3"/>

      <!-- Shoulder shadow -->
      <path d="M -38 30 Q -50 45, -55 75" fill="none" stroke="#14532d" stroke-width="2.5" stroke-opacity="0.5"/>
      <path d="M 38 30 Q 50 45, 55 75" fill="none" stroke="#14532d" stroke-width="2.5" stroke-opacity="0.5"/>

      <!-- ═══ NECK ═══ -->
      <path d="M -12 28 L -10 14 L 10 14 L 12 28 Z"
        fill="#d97706" stroke-width="3"/>
      <path d="M -10 22 L 10 22" stroke="#92400e" stroke-width="1.5" stroke-opacity="0.5"/>

      <!-- ═══ HEAD (warm skin tone, professional proportions) ═══ -->
      <path d="
        M -28 -22
        Q -28 -52, 0 -52
        Q 28 -52, 28 -22
        Q 28 8, 14 14
        Q 0 18, -14 14
        Q -28 8, -28 -22
        Z"
        fill="#f59e0b" stroke-width="4"/>

      <!-- Cheek shading -->
      <ellipse cx="-18" cy="-5" rx="6" ry="4" fill="#dc2626" fill-opacity="0.2" stroke="none"/>
      <ellipse cx="18" cy="-5" rx="6" ry="4" fill="#dc2626" fill-opacity="0.2" stroke="none"/>

      <!-- Ears -->
      <ellipse cx="-28" cy="-15" rx="4" ry="7" fill="#d97706" stroke-width="2.5"/>
      <ellipse cx="28" cy="-15" rx="4" ry="7" fill="#d97706" stroke-width="2.5"/>

      <!-- Eyes (refined) -->
      <ellipse cx="-9" cy="-18" rx="3.5" ry="2.5" fill="#ffffff" stroke-width="1.5"/>
      <ellipse cx="9" cy="-18" rx="3.5" ry="2.5" fill="#ffffff" stroke-width="1.5"/>
      <circle cx="-9" cy="-18" r="1.8" fill="#1c1917" stroke="none"/>
      <circle cx="9" cy="-18" r="1.8" fill="#1c1917" stroke="none"/>

      <!-- Eyebrows -->
      <path d="M -14 -25 Q -9 -28, -4 -25" fill="none" stroke="#1c1917" stroke-width="2.5"/>
      <path d="M 14 -25 Q 9 -28, 4 -25" fill="none" stroke="#1c1917" stroke-width="2.5"/>

      <!-- Nose -->
      <path d="M 0 -15 Q -3 -8, -2 -3 Q 0 -1, 2 -3 Q 3 -8, 0 -15" fill="none" stroke="#92400e" stroke-width="1.8"/>

      <!-- Mustache (mature professional farmer) -->
      <path d="M -10 1 Q -6 5, 0 4 Q 6 5, 10 1 Q 7 -2, 0 -1 Q -7 -2, -10 1 Z"
        fill="#451a03" stroke-width="2"/>

      <!-- Smile under mustache -->
      <path d="M -7 8 Q 0 13, 7 8" fill="none" stroke="#1c1917" stroke-width="2"/>

      <!-- ═══ STRAW HAT (wide brim, classic Indian farmer) ═══ -->
      <!-- Brim back shadow -->
      <ellipse cx="0" cy="-46" rx="56" ry="10" fill="#78350f" stroke-width="0" opacity="0.4"/>
      <!-- Wide brim -->
      <ellipse cx="0" cy="-48" rx="56" ry="10" fill="url(#grainGrad)" stroke="#78350f" stroke-width="4"/>
      <!-- Brim weave texture -->
      <ellipse cx="0" cy="-48" rx="56" ry="6" fill="none" stroke="#92400e" stroke-width="1.5" stroke-opacity="0.4"/>
      <!-- Crown of hat -->
      <path d="
        M -22 -52
        Q -22 -82, 0 -85
        Q 22 -82, 22 -52
        Z"
        fill="url(#grainGrad)" stroke="#78350f" stroke-width="4"/>
      <!-- Crown weave lines -->
      <path d="M -20 -65 Q 0 -68, 20 -65" fill="none" stroke="#92400e" stroke-width="1.5" stroke-opacity="0.5"/>
      <path d="M -18 -75 Q 0 -77, 18 -75" fill="none" stroke="#92400e" stroke-width="1.5" stroke-opacity="0.5"/>
      <!-- Hat band (red ribbon) -->
      <path d="M -22 -54 Q 0 -52, 22 -54 L 22 -49 Q 0 -47, -22 -49 Z"
        fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
      <!-- Hat highlight -->
      <path d="M -10 -78 Q -4 -82, 4 -82" fill="none" stroke="#fef3c7" stroke-width="3" stroke-opacity="0.7"/>

      <!-- ═══ ARMS holding sheaf in front ═══ -->
      <!-- Left arm (curving in to hold sheaf) -->
      <path d="
        M -45 50
        Q -55 70, -32 88
        Q -22 92, -16 86
        L -16 60
        Z"
        fill="#15803d" stroke-width="4"/>
      <!-- Right arm -->
      <path d="
        M 45 50
        Q 55 70, 32 88
        Q 22 92, 16 86
        L 16 60
        Z"
        fill="#15803d" stroke-width="4"/>
      <!-- Sleeve cuffs -->
      <path d="M -34 84 L -16 84" stroke="#14532d" stroke-width="2.5"/>
      <path d="M 34 84 L 16 84" stroke="#14532d" stroke-width="2.5"/>

      <!-- Left hand -->
      <ellipse cx="-22" cy="89" rx="11" ry="9" fill="#f59e0b" stroke-width="3"/>
      <!-- Right hand -->
      <ellipse cx="22" cy="89" rx="11" ry="9" fill="#f59e0b" stroke-width="3"/>

      <!-- ══════════════════════════════
           SHEAF OF WHEAT held in front
           (proper realistic wheat)
           ══════════════════════════════ -->
      <g>
        <!-- Twine wrapping the sheaf base -->
        <path d="M -22 78 Q 0 75, 22 78 L 22 92 Q 0 95, -22 92 Z"
          fill="#78350f" stroke="#451a03" stroke-width="3"/>
        <!-- Twine cross-wrap detail -->
        <line x1="-18" y1="80" x2="18" y2="90" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="-18" y1="90" x2="18" y2="80" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.6"/>

        <!-- ═══ WHEAT STALKS (curving up from twine) ═══ -->
        <g stroke="#65a30d" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M -18 78 Q -22 60, -28 35"/>
          <path d="M -10 76 Q -12 50, -14 22"/>
          <path d="M -3 75  Q -3 45, -5 14"/>
          <path d="M 4 75   Q 4 45, 6 14"/>
          <path d="M 11 76  Q 13 50, 15 22"/>
          <path d="M 19 78  Q 23 60, 29 35"/>
        </g>

        <!-- Small leaf blades on stalks -->
        <g fill="#86efac" stroke="#16a34a" stroke-width="1.5">
          <path d="M -14 55 Q -22 50, -25 42 Q -18 48, -14 55 Z"/>
          <path d="M 14 55 Q 22 50, 25 42 Q 18 48, 14 55 Z"/>
          <path d="M -7 40 Q -14 35, -16 28 Q -10 33, -7 40 Z"/>
          <path d="M 7 40 Q 14 35, 16 28 Q 10 33, 7 40 Z"/>
        </g>

        <!-- ═══ WHEAT HEADS (proper accurate cylindrical heads w/ kernels) ═══ -->
        <g>
          <!-- Each wheat head: oval body with diagonal kernel pattern + bristles -->

          <!-- Head 1 (far left) -->
          <g transform="translate(-28 30) rotate(-20)">
            <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#grainGrad)" stroke="#78350f" stroke-width="2"/>
            <!-- Kernel ridges (diagonal lines) -->
            <path d="M -5 -10 L 5 -7 M -5 -5 L 5 -2 M -5 0 L 5 3 M -5 5 L 5 8" stroke="#854d0e" stroke-width="1.2" fill="none"/>
            <!-- Bristles (awns) -->
            <line x1="-3" y1="-12" x2="-7" y2="-22" stroke="#fde047" stroke-width="1.5"/>
            <line x1="0" y1="-14" x2="0" y2="-26" stroke="#fde047" stroke-width="1.5"/>
            <line x1="3" y1="-12" x2="7" y2="-22" stroke="#fde047" stroke-width="1.5"/>
          </g>

          <!-- Head 2 -->
          <g transform="translate(-14 18) rotate(-10)">
            <ellipse cx="0" cy="0" rx="6" ry="15" fill="url(#grainGrad)" stroke="#78350f" stroke-width="2"/>
            <path d="M -5 -11 L 5 -8 M -5 -6 L 5 -3 M -5 -1 L 5 2 M -5 4 L 5 7 M -5 9 L 5 12" stroke="#854d0e" stroke-width="1.2" fill="none"/>
            <line x1="-3" y1="-13" x2="-6" y2="-24" stroke="#fde047" stroke-width="1.5"/>
            <line x1="0" y1="-15" x2="0" y2="-28" stroke="#fde047" stroke-width="1.5"/>
            <line x1="3" y1="-13" x2="6" y2="-24" stroke="#fde047" stroke-width="1.5"/>
          </g>

          <!-- Head 3 (center-left, tallest) -->
          <g transform="translate(-5 10) rotate(-3)">
            <ellipse cx="0" cy="0" rx="7" ry="16" fill="url(#grainGrad)" stroke="#78350f" stroke-width="2"/>
            <path d="M -6 -12 L 6 -9 M -6 -7 L 6 -4 M -6 -2 L 6 1 M -6 3 L 6 6 M -6 8 L 6 11" stroke="#854d0e" stroke-width="1.2" fill="none"/>
            <line x1="-3" y1="-15" x2="-7" y2="-28" stroke="#fde047" stroke-width="1.6"/>
            <line x1="0" y1="-17" x2="0" y2="-32" stroke="#fde047" stroke-width="1.6"/>
            <line x1="3" y1="-15" x2="7" y2="-28" stroke="#fde047" stroke-width="1.6"/>
          </g>

          <!-- Head 4 (center-right, tallest) -->
          <g transform="translate(6 10) rotate(3)">
            <ellipse cx="0" cy="0" rx="7" ry="16" fill="url(#grainGrad)" stroke="#78350f" stroke-width="2"/>
            <path d="M -6 -12 L 6 -9 M -6 -7 L 6 -4 M -6 -2 L 6 1 M -6 3 L 6 6 M -6 8 L 6 11" stroke="#854d0e" stroke-width="1.2" fill="none"/>
            <line x1="-3" y1="-15" x2="-7" y2="-28" stroke="#fde047" stroke-width="1.6"/>
            <line x1="0" y1="-17" x2="0" y2="-32" stroke="#fde047" stroke-width="1.6"/>
            <line x1="3" y1="-15" x2="7" y2="-28" stroke="#fde047" stroke-width="1.6"/>
          </g>

          <!-- Head 5 -->
          <g transform="translate(15 18) rotate(10)">
            <ellipse cx="0" cy="0" rx="6" ry="15" fill="url(#grainGrad)" stroke="#78350f" stroke-width="2"/>
            <path d="M -5 -11 L 5 -8 M -5 -6 L 5 -3 M -5 -1 L 5 2 M -5 4 L 5 7 M -5 9 L 5 12" stroke="#854d0e" stroke-width="1.2" fill="none"/>
            <line x1="-3" y1="-13" x2="-6" y2="-24" stroke="#fde047" stroke-width="1.5"/>
            <line x1="0" y1="-15" x2="0" y2="-28" stroke="#fde047" stroke-width="1.5"/>
            <line x1="3" y1="-13" x2="6" y2="-24" stroke="#fde047" stroke-width="1.5"/>
          </g>

          <!-- Head 6 (far right) -->
          <g transform="translate(29 30) rotate(20)">
            <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#grainGrad)" stroke="#78350f" stroke-width="2"/>
            <path d="M -5 -10 L 5 -7 M -5 -5 L 5 -2 M -5 0 L 5 3 M -5 5 L 5 8" stroke="#854d0e" stroke-width="1.2" fill="none"/>
            <line x1="-3" y1="-12" x2="-7" y2="-22" stroke="#fde047" stroke-width="1.5"/>
            <line x1="0" y1="-14" x2="0" y2="-26" stroke="#fde047" stroke-width="1.5"/>
            <line x1="3" y1="-12" x2="7" y2="-22" stroke="#fde047" stroke-width="1.5"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════
       WORDMARK — "Ag" white + "Go" lime green
       ══════════════════════════════════════════════════ -->
  <g filter="url(#textShadow)">
    <text
      x="395" y="810"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="170"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-7"
    >Ag</text>
    <text
      x="630" y="810"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="170"
      font-weight="900"
      fill="url(#goGrad)"
      letter-spacing="-7"
    >Go</text>
  </g>

  <!-- TAGLINE -->
  <text
    x="512" y="895"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    fill="#fde68a"
    letter-spacing="14"
    fill-opacity="0.95"
  >RENT · SELL · BUY</text>

  <!-- Underline accent -->
  <rect x="332" y="922" width="360" height="4" rx="2" fill="#fbbf24" fill-opacity="0.6"/>
  <circle cx="332" cy="924" r="6" fill="#fbbf24"/>
  <circle cx="692" cy="924" r="6" fill="#fbbf24"/>
</svg>
