<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BACKGROUND -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- GEAR — premium gold gradient -->
    <linearGradient id="gearOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gearInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="gearShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- WHEAT GREEN -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="grainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- "Go" lime gradient -->
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- ════ AgGoLogo embedded gradients ════ -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="100%" stop-color="#0a2420"/>
    </linearGradient>
    <linearGradient id="logo-eq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="logo-mkt" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="logo-sh" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="logo-ctr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logo-glow-eq" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logo-glow-mkt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logo-glow-sh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="logo-clip">
      <circle cx="60" cy="60" r="55"/>
    </clipPath>
  </defs>

  <!-- BASE -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#sheen)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#shade)"/>
  <rect x="14" y="14" width="996" height="996" rx="218" ry="218"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Halo behind gear -->
  <circle cx="512" cy="395" r="270" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="512" cy="395" r="220" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Decorative sparkles -->
  <circle cx="200" cy="220" r="6" fill="#fde047" fill-opacity="0.7"/>
  <circle cx="824" cy="240" r="8" fill="#bef264" fill-opacity="0.7"/>
  <circle cx="180" cy="500" r="5" fill="#fde047" fill-opacity="0.6"/>
  <circle cx="850" cy="520" r="6" fill="#bef264" fill-opacity="0.6"/>
  <circle cx="240" cy="160" r="14" fill="url(#sparkle)"/>
  <circle cx="800" cy="170" r="14" fill="url(#sparkle)"/>

  <!-- ══════════════════════════════════════════════════
       HERO MARK — Premium GEAR with WHEAT growing inside
       (universal symbol for "agricultural equipment")
       ══════════════════════════════════════════════════ -->
  <g filter="url(#dropShadow)" transform="translate(512 395)">

    <!-- ═══ OUTER GEAR — 12 bold teeth ═══ -->
    <g>
      <!-- Build gear shape: outer circle r=210 with 12 trapezoidal teeth -->
      <path d="
        M 0 -210
        L 32 -210 L 38 -178 L 38 -178
        A 178 178 0 0 1 89 -154
        L 117 -171 L 138 -149 L 154 -89
        A 178 178 0 0 1 178 -38
        L 210 -32 L 210 32 L 178 38
        A 178 178 0 0 1 154 89
        L 171 117 L 149 138 L 89 154
        A 178 178 0 0 1 38 178
        L 32 210 L -32 210 L -38 178
        A 178 178 0 0 1 -89 154
        L -117 171 L -138 149 L -154 89
        A 178 178 0 0 1 -178 38
        L -210 32 L -210 -32 L -178 -38
        A 178 178 0 0 1 -154 -89
        L -171 -117 L -149 -138 L -89 -154
        A 178 178 0 0 1 -38 -178
        L -32 -210 Z
      "
      fill="url(#gearOuter)"
      stroke="#854d0e"
      stroke-width="6"
      stroke-linejoin="round"/>

      <!-- Highlight on top half of gear -->
      <ellipse cx="-30" cy="-90" rx="120" ry="60" fill="url(#gearShine)"/>

      <!-- Inner ring (decorative) -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#854d0e" stroke-width="4" stroke-opacity="0.4"/>

      <!-- Bolt holes between teeth (decorative dots) -->
      <g fill="#854d0e" fill-opacity="0.6">
        <circle cx="0" cy="-150" r="5"/>
        <circle cx="106" cy="-106" r="5"/>
        <circle cx="150" cy="0" r="5"/>
        <circle cx="106" cy="106" r="5"/>
        <circle cx="0" cy="150" r="5"/>
        <circle cx="-106" cy="106" r="5"/>
        <circle cx="-150" cy="0" r="5"/>
        <circle cx="-106" cy="-106" r="5"/>
      </g>

      <!-- ═══ CENTER DISC (where the wheat sits) ═══ -->
      <circle cx="0" cy="0" r="148" fill="#14532d" stroke="#854d0e" stroke-width="6"/>
      <circle cx="0" cy="0" r="148" fill="url(#bgGrad)" fill-opacity="0.8"/>
    </g>

    <!-- ════════════════════════════════════════════════
         AgGoLogo embedded inside the gear
         (Tractor + Crops + Shopping bag + center nexus)
         ════════════════════════════════════════════════ -->
    <g transform="scale(2.45) translate(-60 -60)">

      <!-- Dark logo backdrop (sits inside the gear's inner disc) -->
      <circle cx="60" cy="60" r="55" fill="url(#logo-bg)"/>

      <!-- Subtle hex grid overlay -->
      <g clip-path="url(#logo-clip)" opacity="0.08" stroke="#34d399" stroke-width="0.5">
        <line x1="60" y1="5" x2="60" y2="115"/>
        <line x1="5" y1="32" x2="115" y2="88"/>
        <line x1="5" y1="88" x2="115" y2="32"/>
        <circle cx="60" cy="60" r="25" fill="none"/>
        <circle cx="60" cy="60" r="42" fill="none"/>
      </g>

      <!-- Three segment zone glows -->
      <circle cx="35" cy="38" r="26" fill="url(#logo-glow-eq)"/>
      <circle cx="85" cy="38" r="26" fill="url(#logo-glow-mkt)"/>
      <circle cx="60" cy="85" r="26" fill="url(#logo-glow-sh)"/>

      <!-- Divider lines from center -->
      <line x1="60" y1="60" x2="60" y2="10" stroke="#34d399" stroke-width="0.6" stroke-opacity="0.25"/>
      <line x1="60" y1="60" x2="14" y2="85" stroke="#34d399" stroke-width="0.6" stroke-opacity="0.25"/>
      <line x1="60" y1="60" x2="106" y2="85" stroke="#34d399" stroke-width="0.6" stroke-opacity="0.25"/>

      <!-- ═══ EQUIPMENT — Tractor (top-left, blue) ═══ -->
      <rect x="22" y="37" width="20" height="10" rx="2.5" fill="none" stroke="url(#logo-eq)" stroke-width="1.8"/>
      <path d="M28 37 L30 31 L38 31 L40 37" fill="none" stroke="url(#logo-eq)" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="30.5" y="32.5" width="6" height="4" rx="1" fill="url(#logo-eq)" fill-opacity="0.3" stroke="url(#logo-eq)" stroke-width="0.8"/>
      <line x1="37" y1="28" x2="37" y2="32" stroke="url(#logo-eq)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="28" cy="50" r="6.5" fill="none" stroke="url(#logo-eq)" stroke-width="1.8"/>
      <circle cx="28" cy="50" r="3" fill="url(#logo-eq)" fill-opacity="0.4"/>
      <line x1="28" y1="44" x2="28" y2="56" stroke="url(#logo-eq)" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="22" y1="50" x2="34" y2="50" stroke="url(#logo-eq)" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="23.6" y1="45.4" x2="32.4" y2="54.6" stroke="url(#logo-eq)" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="32.4" y1="45.4" x2="23.6" y2="54.6" stroke="url(#logo-eq)" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="49" r="4" fill="none" stroke="url(#logo-eq)" stroke-width="1.6"/>
      <circle cx="40" cy="49" r="1.5" fill="url(#logo-eq)" fill-opacity="0.4"/>
      <circle cx="28" cy="20" r="2" fill="url(#logo-eq)"/>

      <!-- ═══ MARKETPLACE — Wheat / crop (top-right, gold) ═══ -->
      <line x1="85" y1="55" x2="85" y2="25" stroke="url(#logo-mkt)" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="85" cy="21" rx="3.5" ry="5.5" fill="none" stroke="url(#logo-mkt)" stroke-width="1.6"/>
      <ellipse cx="85" cy="21" rx="1.5" ry="3" fill="url(#logo-mkt)" fill-opacity="0.4"/>
      <line x1="85" y1="16" x2="85" y2="14" stroke="url(#logo-mkt)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M85 45 C80 42 76 36 77 29" stroke="url(#logo-mkt)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="76" cy="25.5" rx="2.8" ry="4.8" fill="none" stroke="url(#logo-mkt)" stroke-width="1.4" transform="rotate(-18 76 25.5)"/>
      <ellipse cx="76" cy="25.5" rx="1.2" ry="2.4" fill="url(#logo-mkt)" fill-opacity="0.4" transform="rotate(-18 76 25.5)"/>
      <path d="M85 45 C90 42 94 36 93 29" stroke="url(#logo-mkt)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="94" cy="25.5" rx="2.8" ry="4.8" fill="none" stroke="url(#logo-mkt)" stroke-width="1.4" transform="rotate(18 94 25.5)"/>
      <ellipse cx="94" cy="25.5" rx="1.2" ry="2.4" fill="url(#logo-mkt)" fill-opacity="0.4" transform="rotate(18 94 25.5)"/>
      <path d="M85 40 C78 37 74 30 75 23" stroke="url(#logo-mkt)" stroke-width="1.1" stroke-linecap="round" fill="none" stroke-opacity="0.55"/>
      <path d="M85 40 C92 37 96 30 95 23" stroke="url(#logo-mkt)" stroke-width="1.1" stroke-linecap="round" fill="none" stroke-opacity="0.55"/>
      <circle cx="92" cy="20" r="2" fill="url(#logo-mkt)"/>

      <!-- ═══ SHOPPER — Shopping bag (bottom-center, violet) ═══ -->
      <path d="M47 82 L49 100 H71 L73 82 Z" fill="none" stroke="url(#logo-sh)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M53 82 Q53 72 60 72 Q67 72 67 82" fill="none" stroke="url(#logo-sh)" stroke-width="2" stroke-linecap="round"/>
      <path d="M48.5 84 L50.5 98 H69.5 L71.5 84 Z" fill="url(#logo-sh)" fill-opacity="0.15"/>
      <line x1="49.5" y1="88.5" x2="70.5" y2="88.5" stroke="url(#logo-sh)" stroke-width="0.9" stroke-opacity="0.5"/>
      <line x1="50.5" y1="93.5" x2="69.5" y2="93.5" stroke="url(#logo-sh)" stroke-width="0.9" stroke-opacity="0.5"/>
      <circle cx="60" cy="77" r="2.2" fill="url(#logo-sh)" fill-opacity="0.5" stroke="url(#logo-sh)" stroke-width="0.8"/>
      <circle cx="60" cy="103" r="2" fill="url(#logo-sh)"/>

      <!-- ═══ CENTER NEXUS ═══ -->
      <circle cx="60" cy="60" r="14" fill="url(#logo-ctr)"/>
      <circle cx="60" cy="60" r="10" fill="none" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="60" cy="60" r="9" fill="#0d2818" fill-opacity="0.95"/>
      <circle cx="60" cy="50" r="2.2" fill="url(#logo-mkt)"/>
      <circle cx="51.3" cy="64.5" r="2.2" fill="url(#logo-eq)"/>
      <circle cx="68.7" cy="64.5" r="2.2" fill="url(#logo-sh)"/>
      <text x="60" y="63.5" text-anchor="middle" font-size="8.5" font-weight="900"
        font-family="'Arial Black', Arial, sans-serif" fill="#34d399" letter-spacing="0.5">AG</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════
       WORDMARK — "Ag" white + "Go" lime green
       ══════════════════════════════════════════════════ -->
  <g filter="url(#textShadow)">
    <text
      x="395" y="810"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="170"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-7"
    >Ag</text>
    <text
      x="630" y="810"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="170"
      font-weight="900"
      fill="url(#goGrad)"
      letter-spacing="-7"
    >Go</text>
  </g>

  <!-- TAGLINE -->
  <text
    x="512" y="895"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    fill="#fde68a"
    letter-spacing="14"
    fill-opacity="0.95"
  >RENT · SELL · BUY</text>

  <!-- Underline accent -->
  <rect x="332" y="922" width="360" height="4" rx="2" fill="#fbbf24" fill-opacity="0.6"/>
  <circle cx="332" cy="924" r="6" fill="#fbbf24"/>
  <circle cx="692" cy="924" r="6" fill="#fbbf24"/>
</svg>
