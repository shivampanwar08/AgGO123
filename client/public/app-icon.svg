<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- Tractor body — classic warm yellow/orange (real tractor look) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cabin / lighter accent -->
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Tire -->
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Window glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- "Go" highlight gradient — bright lime (contrasts against dark bg) -->
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="12" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="puff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BASE -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#sheen)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#shade)"/>
  <rect x="14" y="14" width="996" height="996" rx="218" ry="218"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Halo behind tractor -->
  <ellipse cx="512" cy="430" rx="380" ry="240" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Field lines -->
  <g opacity="0.3" stroke="#86efac" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="640" x2="844" y2="640"/>
    <line x1="200" y1="668" x2="824" y2="668" stroke-opacity="0.7"/>
    <line x1="220" y1="692" x2="804" y2="692" stroke-opacity="0.5"/>
  </g>

  <!-- Smoke puffs -->
  <circle cx="370" cy="170" r="26" fill="url(#puff)"/>
  <circle cx="345" cy="125" r="18" fill="url(#puff)"/>
  <circle cx="328" cy="92"  r="11" fill="url(#puff)"/>

  <!-- ══════════════════════════════════
       TRACTOR — classic side profile
       ══════════════════════════════════ -->
  <g filter="url(#dropShadow)">

    <!-- EXHAUST PIPE -->
    <rect x="354" y="190" width="28" height="100" rx="6" fill="#374151" stroke="#0f172a" stroke-width="4"/>
    <rect x="350" y="186" width="36" height="14" rx="4" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>

    <!-- ENGINE HOOD (front, lower & longer than cabin) -->
    <path d="
      M 600 295
      L 720 295
      Q 760 295, 770 330
      L 780 410
      Q 780 430, 760 430
      L 600 430
      Z"
      fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6" stroke-linejoin="round"/>

    <!-- Hood ridges -->
    <line x1="610" y1="320" x2="765" y2="320" stroke="#92400e" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="610" y1="345" x2="772" y2="345" stroke="#92400e" stroke-width="3" stroke-opacity="0.5"/>

    <!-- Front grille -->
    <rect x="755" y="365" width="22" height="50" rx="4" fill="#1f2937" stroke="#92400e" stroke-width="3"/>
    <line x1="757" y1="375" x2="775" y2="375" stroke="#fbbf24" stroke-width="2"/>
    <line x1="757" y1="385" x2="775" y2="385" stroke="#fbbf24" stroke-width="2"/>
    <line x1="757" y1="395" x2="775" y2="395" stroke="#fbbf24" stroke-width="2"/>
    <line x1="757" y1="405" x2="775" y2="405" stroke="#fbbf24" stroke-width="2"/>

    <!-- Headlight (round, bright) -->
    <circle cx="745" cy="320" r="18" fill="#fef9c3" stroke="#92400e" stroke-width="4"/>
    <circle cx="745" cy="320" r="10" fill="#ffffff"/>

    <!-- ROOF (cabin top - flat overhang, classic tractor cab) -->
    <rect x="395" y="170" width="200" height="22" rx="6" fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6"/>

    <!-- CABIN WINDOWS (boxy with frame) -->
    <path d="M 410 290 L 410 195 L 580 195 L 580 290 Z"
      fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6" stroke-linejoin="round"/>
    <!-- Window glass -->
    <rect x="430" y="210" width="135" height="65" rx="4" fill="url(#glassGrad)" stroke="#92400e" stroke-width="4"/>
    <!-- Window cross frame -->
    <line x1="497" y1="210" x2="497" y2="275" stroke="#92400e" stroke-width="3"/>
    <!-- Glass highlight stripes -->
    <line x1="445" y1="220" x2="475" y2="220" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="510" y1="220" x2="540" y2="220" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>

    <!-- BODY MAIN (connecting cabin to hood) -->
    <path d="
      M 410 290
      L 580 290
      L 600 295
      L 600 430
      L 360 430
      L 360 320
      Q 360 290, 380 290
      Z"
      fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6" stroke-linejoin="round"/>

    <!-- Side door handle -->
    <rect x="475" y="330" width="40" height="8" rx="3" fill="#92400e" fill-opacity="0.5"/>

    <!-- ── SIDE STEPS / FENDER ── -->
    <rect x="295" y="430" width="490" height="18" rx="4" fill="#92400e" stroke="#0f172a" stroke-width="3"/>

    <!-- ══════════════════════════════════
         REAR WHEEL — BIG (signature tractor)
         ══════════════════════════════════ -->
    <g>
      <!-- Outer tread ring -->
      <circle cx="385" cy="540" r="135" fill="url(#tireGrad)" stroke="#fde047" stroke-width="6"/>
      <!-- Bold deep tread blocks -->
      <g fill="#374151" stroke="#0f172a" stroke-width="2">
        <rect x="378" y="408" width="14" height="22" rx="3"/>
        <rect x="463" y="436" width="22" height="14" rx="3" transform="rotate(40 474 443)"/>
        <rect x="497" y="535" width="22" height="14" rx="3"/>
        <rect x="463" y="630" width="22" height="14" rx="3" transform="rotate(-40 474 637)"/>
        <rect x="378" y="660" width="14" height="22" rx="3"/>
        <rect x="287" y="630" width="22" height="14" rx="3" transform="rotate(40 298 637)"/>
        <rect x="251" y="535" width="22" height="14" rx="3"/>
        <rect x="287" y="436" width="22" height="14" rx="3" transform="rotate(-40 298 443)"/>
      </g>
      <!-- Inner hub (yellow) -->
      <circle cx="385" cy="540" r="68" fill="url(#bodyGrad)" stroke="#92400e" stroke-width="6"/>
      <!-- Spokes -->
      <g stroke="#92400e" stroke-width="10" stroke-linecap="round">
        <line x1="385" y1="482" x2="385" y2="598"/>
        <line x1="327" y1="540" x2="443" y2="540"/>
        <line x1="344" y1="499" x2="426" y2="581"/>
        <line x1="426" y1="499" x2="344" y2="581"/>
      </g>
      <!-- Center bolt -->
      <circle cx="385" cy="540" r="16" fill="#92400e"/>
      <circle cx="385" cy="540" r="7" fill="#fde047"/>
    </g>

    <!-- ══════════════════════════════════
         FRONT WHEEL — SMALLER
         ══════════════════════════════════ -->
    <g>
      <circle cx="710" cy="565" r="80" fill="url(#tireGrad)" stroke="#fde047" stroke-width="5"/>
      <!-- Treads -->
      <g fill="#374151" stroke="#0f172a" stroke-width="1.5">
        <rect x="704" y="491" width="12" height="16" rx="2"/>
        <rect x="775" y="559" width="16" height="12" rx="2"/>
        <rect x="704" y="623" width="12" height="16" rx="2"/>
        <rect x="629" y="559" width="16" height="12" rx="2"/>
      </g>
      <!-- Inner hub -->
      <circle cx="710" cy="565" r="38" fill="url(#bodyGrad)" stroke="#92400e" stroke-width="5"/>
      <g stroke="#92400e" stroke-width="6" stroke-linecap="round">
        <line x1="710" y1="533" x2="710" y2="597"/>
        <line x1="678" y1="565" x2="742" y2="565"/>
      </g>
      <circle cx="710" cy="565" r="10" fill="#92400e"/>
      <circle cx="710" cy="565" r="4" fill="#fde047"/>
    </g>
  </g>

  <!-- ══════════════════════════════════
       WORDMARK — "Ag" white + "Go" lime green
       ══════════════════════════════════ -->
  <g filter="url(#textShadow)">
    <!-- "Ag" in white -->
    <text
      x="402" y="800"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="190"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-8"
    >Ag</text>
    <!-- "Go" in bright lime green (contrasts against dark green bg) -->
    <text
      x="618" y="800"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="190"
      font-weight="900"
      fill="url(#goGrad)"
      letter-spacing="-8"
    >Go</text>
  </g>

  <!-- TAGLINE -->
  <text
    x="512" y="890"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="48"
    font-weight="800"
    fill="#fde68a"
    letter-spacing="14"
    fill-opacity="0.95"
  >RENT · SELL · BUY</text>

  <!-- Underline accent -->
  <rect x="332" y="918" width="360" height="4" rx="2" fill="#fbbf24" fill-opacity="0.6"/>
  <circle cx="332" cy="920" r="6" fill="#fbbf24"/>
  <circle cx="692" cy="920" r="6" fill="#fbbf24"/>
</svg>
