<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="botShade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base rounded square (matches app's rounded-3xl style) -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#topGlow)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#botShade)"/>
  <rect x="16" y="16" width="992" height="992" rx="216" ry="216"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- ──────────────────────────────────
       TOP — Tiny sprout accent above wordmark
       ────────────────────────────────── -->
  <g filter="url(#softShadow)">
    <path d="M 512 175 Q 540 150, 558 122 Q 532 138, 512 168 Z" fill="#86efac"/>
    <path d="M 512 175 Q 484 150, 466 122 Q 492 138, 512 168 Z" fill="#86efac"/>
    <circle cx="512" cy="180" r="14" fill="#fde68a"/>
  </g>

  <!-- ──────────────────────────────────
       WORDMARK — "AgGo" bold, instantly readable
       ────────────────────────────────── -->
  <g filter="url(#softShadow)">
    <text
      x="512" y="445"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="240"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-8"
    >AgGo</text>
  </g>

  <!-- Gold underline accent -->
  <rect x="312" y="495" width="400" height="6" rx="3" fill="url(#goldLine)"/>

  <!-- Tagline -->
  <text
    x="512" y="555"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    fill="#dcfce7"
    letter-spacing="14"
    fill-opacity="0.85"
  >FARM • SELL • SHOP</text>

  <!-- ──────────────────────────────────
       FEATURE ICONS — 3 circles in a row
       ────────────────────────────────── -->

  <!-- ① EQUIPMENT — Blue circle with tractor -->
  <g transform="translate(280 760)">
    <circle cx="0" cy="0" r="80" fill="#0ea5e9" stroke="#ffffff" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="url(#topGlow)"/>
    <!-- Tractor body -->
    <rect x="-32" y="-12" width="50" height="24" rx="4" fill="#ffffff"/>
    <!-- Cab -->
    <path d="M -18 -12 L -14 -28 L 6 -28 L 14 -12 Z" fill="#ffffff"/>
    <rect x="-12" y="-25" width="14" height="11" rx="2" fill="#0ea5e9"/>
    <!-- Exhaust -->
    <rect x="14" y="-32" width="4" height="8" rx="1" fill="#ffffff"/>
    <!-- Big rear wheel -->
    <circle cx="-22" cy="20" r="16" fill="#ffffff"/>
    <circle cx="-22" cy="20" r="7" fill="#0ea5e9"/>
    <!-- Small front wheel -->
    <circle cx="14" cy="22" r="11" fill="#ffffff"/>
    <circle cx="14" cy="22" r="4.5" fill="#0ea5e9"/>
  </g>

  <!-- ② MARKETPLACE — Gold circle with wheat -->
  <g transform="translate(512 760)">
    <circle cx="0" cy="0" r="80" fill="#f59e0b" stroke="#ffffff" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="url(#topGlow)"/>
    <!-- Center stalk -->
    <line x1="0" y1="40" x2="0" y2="-30" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Top grain -->
    <ellipse cx="0" cy="-36" rx="10" ry="16" fill="#ffffff"/>
    <line x1="0" y1="-52" x2="0" y2="-58" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Left grains -->
    <ellipse cx="-18" cy="-20" rx="7" ry="12" fill="#ffffff" transform="rotate(-25 -18 -20)"/>
    <ellipse cx="-22" cy="0"  rx="7" ry="12" fill="#ffffff" transform="rotate(-25 -22 0)"/>
    <!-- Right grains -->
    <ellipse cx="18" cy="-20" rx="7" ry="12" fill="#ffffff" transform="rotate(25 18 -20)"/>
    <ellipse cx="22" cy="0"   rx="7" ry="12" fill="#ffffff" transform="rotate(25 22 0)"/>
  </g>

  <!-- ③ SHOPPER — Violet circle with shopping cart -->
  <g transform="translate(744 760)">
    <circle cx="0" cy="0" r="80" fill="#8b5cf6" stroke="#ffffff" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="url(#topGlow)"/>
    <!-- Cart handle (top-left diagonal) -->
    <path d="M -38 -22 L -22 -22 L -14 18 L 28 18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart basket -->
    <path d="M -16 -8 L 34 -8 L 28 18 L -10 18 Z" fill="#ffffff"/>
    <!-- Wheels -->
    <circle cx="-6" cy="32" r="6" fill="#ffffff"/>
    <circle cx="22" cy="32" r="6" fill="#ffffff"/>
    <circle cx="-6" cy="32" r="2.5" fill="#8b5cf6"/>
    <circle cx="22" cy="32" r="2.5" fill="#8b5cf6"/>
  </g>
</svg>
