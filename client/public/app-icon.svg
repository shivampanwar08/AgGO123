<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bold brand green background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- Tractor body gradient — clean white-to-cream for premium feel -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <!-- Tire / wheel — dark tone -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Window glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Exhaust smoke puff -->
    <radialGradient id="puff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ──────────────────────────────────
       BASE — bold green rounded square
       ────────────────────────────────── -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#sheen)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#shade)"/>
  <rect x="14" y="14" width="996" height="996" rx="218" ry="218"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Soft halo behind tractor -->
  <ellipse cx="512" cy="450" rx="340" ry="240" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Field lines (suggesting farmland under the tractor) -->
  <g opacity="0.25" stroke="#86efac" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="640" x2="844" y2="640"/>
    <line x1="200" y1="665" x2="824" y2="665" stroke-opacity="0.7"/>
    <line x1="220" y1="688" x2="804" y2="688" stroke-opacity="0.5"/>
  </g>

  <!-- ──────────────────────────────────
       EXHAUST SMOKE PUFFS
       ────────────────────────────────── -->
  <circle cx="370" cy="200" r="22" fill="url(#puff)"/>
  <circle cx="345" cy="160" r="16" fill="url(#puff)"/>
  <circle cx="328" cy="128" r="10" fill="url(#puff)"/>

  <!-- ──────────────────────────────────
       TRACTOR — the hero mark
       ────────────────────────────────── -->
  <g filter="url(#dropShadow)">

    <!-- ── EXHAUST PIPE ── -->
    <rect x="362" y="220" width="20" height="80" rx="4" fill="url(#bodyGrad)"/>
    <rect x="358" y="216" width="28" height="14" rx="3" fill="url(#bodyGrad)"/>

    <!-- ── CABIN / DRIVER ROOF ── -->
    <path d="M 412 230 L 432 165 L 530 165 L 555 230 Z"
      fill="url(#bodyGrad)" stroke="#16a34a" stroke-width="6" stroke-linejoin="round"/>

    <!-- Cabin window -->
    <path d="M 432 220 L 446 175 L 522 175 L 540 220 Z"
      fill="url(#glassGrad)" stroke="#16a34a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Window highlight stripe -->
    <line x1="455" y1="195" x2="478" y2="195" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Cabin pillars / posts -->
    <line x1="432" y1="220" x2="446" y2="175" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <line x1="555" y1="225" x2="522" y2="175" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>

    <!-- ── MAIN BODY (engine + chassis) ── -->
    <!-- Chassis -->
    <path d="
      M 340 300
      L 340 240
      Q 340 230, 350 230
      L 600 230
      Q 700 230, 720 280
      L 750 360
      Q 750 380, 730 380
      L 350 380
      Q 340 380, 340 370
      Z"
      fill="url(#bodyGrad)" stroke="#16a34a" stroke-width="6" stroke-linejoin="round"/>

    <!-- Hood detail line -->
    <line x1="600" y1="260" x2="730" y2="320" stroke="#15803d" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="600" y1="300" x2="745" y2="350" stroke="#15803d" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Headlight (front of tractor) -->
    <circle cx="715" cy="280" r="14" fill="#fde047" stroke="#16a34a" stroke-width="4"/>
    <circle cx="715" cy="280" r="6" fill="#ffffff"/>

    <!-- Side ladder/step -->
    <rect x="560" y="380" width="8" height="40" rx="2" fill="url(#bodyGrad)"/>

    <!-- ── REAR WHEEL — BIG (signature tractor look) ── -->
    <g>
      <!-- Outer tire -->
      <circle cx="380" cy="475" r="135" fill="url(#tireGrad)" stroke="#ffffff" stroke-width="10"/>
      <!-- Tread pattern (the deep grooves) -->
      <g stroke="#374151" stroke-width="8" stroke-linecap="round" fill="none">
        <line x1="380" y1="345" x2="380" y2="370"/>
        <line x1="475" y1="380" x2="455" y2="400"/>
        <line x1="515" y1="475" x2="490" y2="475"/>
        <line x1="475" y1="570" x2="455" y2="550"/>
        <line x1="380" y1="610" x2="380" y2="585"/>
        <line x1="285" y1="570" x2="305" y2="550"/>
        <line x1="245" y1="475" x2="270" y2="475"/>
        <line x1="285" y1="380" x2="305" y2="400"/>
      </g>
      <!-- Inner hub -->
      <circle cx="380" cy="475" r="65" fill="url(#bodyGrad)" stroke="#16a34a" stroke-width="6"/>
      <!-- Wheel spokes -->
      <g stroke="#16a34a" stroke-width="9" stroke-linecap="round">
        <line x1="380" y1="420" x2="380" y2="530"/>
        <line x1="325" y1="475" x2="435" y2="475"/>
        <line x1="343" y1="438" x2="417" y2="512"/>
        <line x1="417" y1="438" x2="343" y2="512"/>
      </g>
      <!-- Center bolt -->
      <circle cx="380" cy="475" r="14" fill="#16a34a"/>
      <circle cx="380" cy="475" r="6" fill="#ffffff"/>
    </g>

    <!-- ── FRONT WHEEL — SMALLER ── -->
    <g>
      <!-- Outer tire -->
      <circle cx="700" cy="510" r="80" fill="url(#tireGrad)" stroke="#ffffff" stroke-width="8"/>
      <!-- Treads -->
      <g stroke="#374151" stroke-width="6" stroke-linecap="round">
        <line x1="700" y1="436" x2="700" y2="455"/>
        <line x1="775" y1="510" x2="755" y2="510"/>
        <line x1="700" y1="585" x2="700" y2="565"/>
        <line x1="625" y1="510" x2="645" y2="510"/>
      </g>
      <!-- Inner hub -->
      <circle cx="700" cy="510" r="36" fill="url(#bodyGrad)" stroke="#16a34a" stroke-width="5"/>
      <!-- Spokes -->
      <g stroke="#16a34a" stroke-width="6" stroke-linecap="round">
        <line x1="700" y1="478" x2="700" y2="542"/>
        <line x1="668" y1="510" x2="732" y2="510"/>
      </g>
      <!-- Center -->
      <circle cx="700" cy="510" r="9" fill="#16a34a"/>
    </g>

    <!-- Connecting axle bar between wheels -->
    <rect x="500" y="495" width="160" height="14" rx="4" fill="url(#bodyGrad)"/>
  </g>

  <!-- ──────────────────────────────────
       WORDMARK — "AgGo" big, bold, clear
       ────────────────────────────────── -->
  <g filter="url(#textShadow)">
    <text
      x="512" y="800"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="180"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-6"
    >AgGo</text>
  </g>

  <!-- ──────────────────────────────────
       TAGLINE — what the app does
       ────────────────────────────────── -->
  <text
    x="512" y="890"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#fde68a"
    letter-spacing="10"
    fill-opacity="0.95"
  >RENT FARM EQUIPMENT</text>

  <!-- Decorative gold underline accent -->
  <rect x="332" y="915" width="360" height="4" rx="2" fill="#fbbf24" fill-opacity="0.6"/>
</svg>
