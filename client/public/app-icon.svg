<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BACKGROUND -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- GEAR — premium gold gradient -->
    <linearGradient id="gearOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gearInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="gearShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- WHEAT GREEN -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="grainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- "Go" lime gradient -->
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BASE -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#sheen)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#shade)"/>
  <rect x="14" y="14" width="996" height="996" rx="218" ry="218"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Halo behind gear -->
  <circle cx="512" cy="395" r="270" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="512" cy="395" r="220" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Decorative sparkles -->
  <circle cx="200" cy="220" r="6" fill="#fde047" fill-opacity="0.7"/>
  <circle cx="824" cy="240" r="8" fill="#bef264" fill-opacity="0.7"/>
  <circle cx="180" cy="500" r="5" fill="#fde047" fill-opacity="0.6"/>
  <circle cx="850" cy="520" r="6" fill="#bef264" fill-opacity="0.6"/>
  <circle cx="240" cy="160" r="14" fill="url(#sparkle)"/>
  <circle cx="800" cy="170" r="14" fill="url(#sparkle)"/>

  <!-- ══════════════════════════════════════════════════
       HERO MARK — Premium GEAR with WHEAT growing inside
       (universal symbol for "agricultural equipment")
       ══════════════════════════════════════════════════ -->
  <g filter="url(#dropShadow)" transform="translate(512 395)">

    <!-- ═══ OUTER GEAR — 12 bold teeth ═══ -->
    <g>
      <!-- Build gear shape: outer circle r=210 with 12 trapezoidal teeth -->
      <path d="
        M 0 -210
        L 32 -210 L 38 -178 L 38 -178
        A 178 178 0 0 1 89 -154
        L 117 -171 L 138 -149 L 154 -89
        A 178 178 0 0 1 178 -38
        L 210 -32 L 210 32 L 178 38
        A 178 178 0 0 1 154 89
        L 171 117 L 149 138 L 89 154
        A 178 178 0 0 1 38 178
        L 32 210 L -32 210 L -38 178
        A 178 178 0 0 1 -89 154
        L -117 171 L -138 149 L -154 89
        A 178 178 0 0 1 -178 38
        L -210 32 L -210 -32 L -178 -38
        A 178 178 0 0 1 -154 -89
        L -171 -117 L -149 -138 L -89 -154
        A 178 178 0 0 1 -38 -178
        L -32 -210 Z
      "
      fill="url(#gearOuter)"
      stroke="#854d0e"
      stroke-width="6"
      stroke-linejoin="round"/>

      <!-- Highlight on top half of gear -->
      <ellipse cx="-30" cy="-90" rx="120" ry="60" fill="url(#gearShine)"/>

      <!-- Inner ring (decorative) -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#854d0e" stroke-width="4" stroke-opacity="0.4"/>

      <!-- Bolt holes between teeth (decorative dots) -->
      <g fill="#854d0e" fill-opacity="0.6">
        <circle cx="0" cy="-150" r="5"/>
        <circle cx="106" cy="-106" r="5"/>
        <circle cx="150" cy="0" r="5"/>
        <circle cx="106" cy="106" r="5"/>
        <circle cx="0" cy="150" r="5"/>
        <circle cx="-106" cy="106" r="5"/>
        <circle cx="-150" cy="0" r="5"/>
        <circle cx="-106" cy="-106" r="5"/>
      </g>

      <!-- ═══ CENTER DISC (where the wheat sits) ═══ -->
      <circle cx="0" cy="0" r="125" fill="#14532d" stroke="#854d0e" stroke-width="6"/>
      <circle cx="0" cy="0" r="125" fill="url(#bgGrad)" fill-opacity="0.8"/>
    </g>

    <!-- ═══ FARMER carrying CROPS on his shoulder ═══ -->
    <g stroke="#1c1917" stroke-linejoin="round" stroke-linecap="round">

      <!-- Ground line (subtle field) -->
      <ellipse cx="0" cy="92" rx="80" ry="6" fill="#000000" fill-opacity="0.25" stroke="none"/>

      <!-- ═══ LEGS ═══ (standing pose, walking) -->
      <!-- Back leg -->
      <path d="M -8 30 L -22 88 L -8 90 L 4 38 Z"
        fill="#1e40af" stroke-width="3"/>
      <!-- Front leg -->
      <path d="M 10 30 L 18 88 L 32 88 L 28 35 Z"
        fill="#2563eb" stroke-width="3"/>
      <!-- Boots -->
      <ellipse cx="-15" cy="92" rx="14" ry="6" fill="#451a03" stroke-width="3"/>
      <ellipse cx="25" cy="92" rx="14" ry="6" fill="#451a03" stroke-width="3"/>

      <!-- ═══ TORSO (kurta/shirt) ═══ -->
      <path d="
        M -28 -10
        Q -34 -5, -32 10
        L -26 35
        Q -8 42, 30 32
        L 32 5
        Q 30 -10, 22 -14
        L -20 -14
        Z"
        fill="#dc2626" stroke-width="4"/>
      <!-- Shirt collar/V -->
      <path d="M -8 -14 L 0 -2 L 10 -14 Z" fill="#fef9c3" stroke-width="2"/>

      <!-- ═══ FRONT ARM (holding bundle) ═══ -->
      <path d="M 28 0 Q 50 5, 55 25 Q 50 35, 38 32 Q 30 22, 28 12 Z"
        fill="#dc2626" stroke-width="3"/>
      <!-- Front hand -->
      <circle cx="55" cy="28" r="9" fill="#fcd34d" stroke-width="3"/>

      <!-- ═══ BACK ARM (raised, holding sheaf above shoulder) ═══ -->
      <path d="M -22 -8 Q -40 -20, -36 -42 Q -28 -48, -20 -42 Q -16 -25, -14 -10 Z"
        fill="#dc2626" stroke-width="3"/>
      <!-- Back hand near sheaf -->
      <circle cx="-30" cy="-45" r="9" fill="#fcd34d" stroke-width="3"/>

      <!-- ═══ HEAD (skin tone, looking forward) ═══ -->
      <ellipse cx="0" cy="-30" rx="20" ry="22" fill="#fcd34d" stroke-width="4"/>
      <!-- Beard/chin shadow -->
      <path d="M -12 -22 Q 0 -14, 12 -22 Q 12 -16, 0 -10 Q -12 -16, -12 -22 Z"
        fill="#92400e" stroke-width="0" opacity="0.5"/>
      <!-- Eyes -->
      <circle cx="-7" cy="-32" r="2.2" fill="#1c1917" stroke="none"/>
      <circle cx="7" cy="-32" r="2.2" fill="#1c1917" stroke="none"/>
      <!-- Smile -->
      <path d="M -6 -22 Q 0 -18, 6 -22" fill="none" stroke="#1c1917" stroke-width="2"/>

      <!-- ═══ FARMER HAT (wide-brim straw hat) ═══ -->
      <ellipse cx="0" cy="-50" rx="42" ry="9" fill="#a16207" stroke-width="4"/>
      <ellipse cx="0" cy="-50" rx="42" ry="6" fill="#ca8a04" stroke-width="0"/>
      <!-- Hat crown -->
      <path d="M -18 -52 Q -16 -68, 0 -70 Q 16 -68, 18 -52 Z"
        fill="#ca8a04" stroke-width="4"/>
      <!-- Hat band -->
      <rect x="-18" y="-56" width="36" height="5" rx="2" fill="#dc2626" stroke-width="0"/>

      <!-- ═══ SHEAF OF CROPS on shoulder (golden wheat bundle) ═══ -->
      <g transform="translate(-30 -55)">
        <!-- Bundle wrap (rope) -->
        <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#grainGrad)" stroke="#854d0e" stroke-width="3"/>
        <!-- Rope tying the bundle -->
        <ellipse cx="0" cy="0" rx="22" ry="3" fill="#451a03" stroke-width="0"/>
        <!-- Wheat stalks fanning UP from bundle -->
        <g stroke="#16a34a" stroke-width="3" stroke-linecap="round">
          <line x1="-15" y1="-10" x2="-22" y2="-40"/>
          <line x1="-7" y1="-12" x2="-10" y2="-44"/>
          <line x1="0" y1="-12" x2="0" y2="-46"/>
          <line x1="8" y1="-12" x2="11" y2="-44"/>
          <line x1="15" y1="-10" x2="22" y2="-40"/>
        </g>
        <!-- Golden grain heads on top of each stalk -->
        <g fill="url(#grainGrad)" stroke="#854d0e" stroke-width="2">
          <ellipse cx="-22" cy="-44" rx="5" ry="8" transform="rotate(-15 -22 -44)"/>
          <ellipse cx="-10" cy="-48" rx="5" ry="8" transform="rotate(-7 -10 -48)"/>
          <ellipse cx="0" cy="-50" rx="5" ry="8"/>
          <ellipse cx="11" cy="-48" rx="5" ry="8" transform="rotate(7 11 -48)"/>
          <ellipse cx="22" cy="-44" rx="5" ry="8" transform="rotate(15 22 -44)"/>
        </g>
        <!-- Wheat tip awns -->
        <g stroke="#fde047" stroke-width="2" stroke-linecap="round">
          <line x1="-22" y1="-50" x2="-26" y2="-58"/>
          <line x1="-10" y1="-54" x2="-12" y2="-62"/>
          <line x1="0" y1="-56" x2="0" y2="-66"/>
          <line x1="11" y1="-54" x2="13" y2="-62"/>
          <line x1="22" y1="-50" x2="26" y2="-58"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════
       WORDMARK — "Ag" white + "Go" lime green
       ══════════════════════════════════════════════════ -->
  <g filter="url(#textShadow)">
    <text
      x="395" y="810"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="170"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-7"
    >Ag</text>
    <text
      x="630" y="810"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-size="170"
      font-weight="900"
      fill="url(#goGrad)"
      letter-spacing="-7"
    >Go</text>
  </g>

  <!-- TAGLINE -->
  <text
    x="512" y="895"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    fill="#fde68a"
    letter-spacing="14"
    fill-opacity="0.95"
  >RENT · SELL · BUY</text>

  <!-- Underline accent -->
  <rect x="332" y="922" width="360" height="4" rx="2" fill="#fbbf24" fill-opacity="0.6"/>
  <circle cx="332" cy="924" r="6" fill="#fbbf24"/>
  <circle cx="692" cy="924" r="6" fill="#fbbf24"/>
</svg>
